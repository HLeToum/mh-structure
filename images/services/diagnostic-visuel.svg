<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1929"/>
      <stop offset="100%" style="stop-color:#152038"/>
    </linearGradient>
    <radialGradient id="crack-glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#DFB95E;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#DFB95E;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="400" height="240" fill="url(#bg2)" rx="8"/>
  <rect width="400" height="240" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.2" rx="8"/>

  <!-- Building facade -->
  <rect x="80" y="30" width="200" height="180" fill="#141E35" stroke="#3D5068" stroke-width="1.5" rx="2"/>
  <!-- Windows -->
  <rect x="100" y="50" width="35" height="30" fill="#182440" stroke="#3D5068" stroke-width="1" rx="1"/>
  <rect x="145" y="50" width="35" height="30" fill="#182440" stroke="#3D5068" stroke-width="1" rx="1"/>
  <rect x="190" y="50" width="35" height="30" fill="#182440" stroke="#3D5068" stroke-width="1" rx="1"/>
  <rect x="235" y="50" width="35" height="30" fill="#182440" stroke="#3D5068" stroke-width="1" rx="1"/>
  <rect x="100" y="100" width="35" height="30" fill="#182440" stroke="#3D5068" stroke-width="1" rx="1"/>
  <rect x="145" y="100" width="35" height="30" fill="#182440" stroke="#3D5068" stroke-width="1" rx="1"/>
  <rect x="190" y="100" width="35" height="30" fill="#182440" stroke="#3D5068" stroke-width="1" rx="1"/>
  <rect x="235" y="100" width="35" height="30" fill="#182440" stroke="#3D5068" stroke-width="1" rx="1"/>
  <!-- Door -->
  <rect x="155" y="160" width="50" height="50" fill="#182440" stroke="#3D5068" stroke-width="1" rx="1"/>

  <!-- Fissures -->
  <g stroke="#DFB95E" stroke-width="1.5" stroke-linecap="round" filter="url(#glow2)">
    <polyline points="130,95 127,105 133,115 128,128" fill="none"/>
    <polyline points="220,88 223,98 217,112 222,125 218,138" fill="none"/>
    <polyline points="175,155 178,162 172,168 176,175" fill="none"/>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(235, 110)" filter="url(#glow2)">
    <circle cx="0" cy="0" r="28" fill="#0F1929" fill-opacity="0.85" stroke="#C9A84C" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="url(#crack-glow)"/>
    <!-- Zoomed crack inside glass -->
    <polyline points="-8,-10 -5,0 2,8 -2,18" stroke="#DFB95E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Glass handle -->
    <line x1="20" y1="20" x2="38" y2="38" stroke="#C9A84C" stroke-width="4" stroke-linecap="round"/>
    <line x1="33" y1="33" x2="43" y2="43" stroke="#9A7C38" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Severity indicators -->
  <g transform="translate(0,0)">
    <rect x="308" y="40" width="80" height="18" rx="3" fill="#141E35" stroke="#C9A84C" stroke-width="0.6" stroke-opacity="0.5"/>
    <circle cx="320" cy="49" r="4" fill="#C9A84C"/>
    <text x="330" y="53" font-family="monospace" font-size="8" fill="#C9A84C">SÉVÈRE</text>

    <rect x="308" y="65" width="80" height="18" rx="3" fill="#141E35" stroke="#8899B4" stroke-width="0.5" stroke-opacity="0.5"/>
    <circle cx="320" cy="74" r="4" fill="#DFB95E"/>
    <text x="330" y="78" font-family="monospace" font-size="8" fill="#8899B4">MODÉRÉ</text>

    <rect x="308" y="90" width="80" height="18" rx="3" fill="#141E35" stroke="#3D5068" stroke-width="0.5"/>
    <circle cx="320" cy="99" r="4" fill="#3D5068"/>
    <text x="330" y="103" font-family="monospace" font-size="8" fill="#3D5068">FAIBLE</text>
  </g>

  <!-- Annotation lines -->
  <line x1="133" y1="110" x2="308" y2="49" stroke="#DFB95E" stroke-width="0.8" stroke-dasharray="4,3" stroke-opacity="0.6"/>
  <line x1="218" y1="120" x2="308" y2="74" stroke="#DFB95E" stroke-width="0.8" stroke-dasharray="4,3" stroke-opacity="0.4"/>

  <!-- Left panel - rapport -->
  <rect x="8" y="40" width="65" height="90" fill="#141E35" rx="4" stroke="#C9A84C" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="40" y="56" font-family="monospace" font-size="7" fill="#C9A84C" text-anchor="middle">RAPPORT</text>
  <line x1="14" y1="60" x2="66" y2="60" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="18" y="72" font-family="monospace" font-size="6" fill="#8899B4">Désordre 1</text>
  <text x="18" y="82" font-family="monospace" font-size="6" fill="#8899B4">Désordre 2</text>
  <text x="18" y="92" font-family="monospace" font-size="6" fill="#8899B4">Désordre 3</text>
  <line x1="14" y1="97" x2="66" y2="97" stroke="#3D5068" stroke-width="0.5"/>
  <text x="18" y="108" font-family="monospace" font-size="6" fill="#3D5068">Niveau : B</text>
  <text x="18" y="118" font-family="monospace" font-size="6" fill="#3D5068">Urgence : ✓</text>

  <text x="200" y="18" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#C9A84C" text-anchor="middle" font-weight="600" letter-spacing="2">DIAGNOSTIC VISUEL STRUCTUREL</text>
  <line x1="60" y1="23" x2="340" y2="23" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
</svg>
