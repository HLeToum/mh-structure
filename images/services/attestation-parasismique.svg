<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1929"/>
      <stop offset="100%" style="stop-color:#182440"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DFB95E"/>
      <stop offset="100%" style="stop-color:#C9A84C"/>
    </linearGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="400" height="240" fill="url(#bg4)" rx="8"/>
  <rect width="400" height="240" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.2" rx="8"/>

  <!-- Document / Permit background -->
  <rect x="100" y="35" width="180" height="175" fill="#141E35" rx="4" stroke="#3D5068" stroke-width="1.5"/>
  <!-- Document header band -->
  <rect x="100" y="35" width="180" height="28" fill="#182440" rx="4"/>
  <rect x="100" y="51" width="180" height="12" fill="#182440"/>

  <!-- Stamp / seal circle -->
  <g filter="url(#glow4)" transform="translate(190, 145)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#C9A84C" stroke-width="2" stroke-dasharray="4,3"/>
    <circle cx="0" cy="0" r="30" fill="#0F1929" stroke="#C9A84C" stroke-width="1.5"/>
    <!-- Shield inside seal -->
    <path d="M0,-18 L14,-8 L14,8 Q14,20 0,24 Q-14,20 -14,8 L-14,-8 Z" fill="none" stroke="#DFB95E" stroke-width="1.5"/>
    <path d="M0,-18 L14,-8 L14,8 Q14,20 0,24 Q-14,20 -14,8 L-14,-8 Z" fill="#C9A84C" fill-opacity="0.1"/>
    <!-- Check mark inside shield -->
    <polyline points="-6,2 -1,8 8,-6" stroke="#DFB95E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Seal text arc (top) -->
    <text font-family="monospace" font-size="5.5" fill="#C9A84C" text-anchor="middle">
      <textPath xlink:href="#arc-top4" startOffset="50%">ATTESTATION PARASISMIQUE</textPath>
    </text>
  </g>
  <defs>
    <path id="arc-top4" d="M -28,0 A 28,28 0 0,1 28,0"/>
  </defs>

  <!-- Seal text rendered differently since textPath needs defs -->
  <text x="190" y="174" font-family="monospace" font-size="5" fill="#C9A84C" text-anchor="middle" letter-spacing="1">PRÉFECTURE</text>

  <!-- Document lines (text simulation) -->
  <g fill="#3D5068">
    <rect x="115" y="72" width="100" height="4" rx="1"/>
    <rect x="115" y="80" width="140" height="3" rx="1"/>
    <rect x="115" y="87" width="120" height="3" rx="1"/>
  </g>
  <!-- Ref number -->
  <text x="190" y="105" font-family="monospace" font-size="7" fill="#8899B4" text-anchor="middle">Réf : AT-PS-2024-0847</text>
  <line x1="115" y1="109" x2="265" y2="109" stroke="#3D5068" stroke-width="0.7"/>
  <text x="190" y="120" font-family="monospace" font-size="6" fill="#3D5068" text-anchor="middle">ZONE DE SISMICITÉ : 3</text>
  <text x="190" y="130" font-family="monospace" font-size="6" fill="#3D5068" text-anchor="middle">Classe d'importance : II</text>

  <!-- Signature line -->
  <line x1="125" y1="197" x2="185" y2="197" stroke="#3D5068" stroke-width="0.8"/>
  <text x="155" y="207" font-family="monospace" font-size="5.5" fill="#3D5068" text-anchor="middle">Signature</text>

  <!-- Eurocode badge - left panel -->
  <rect x="10" y="60" width="75" height="95" fill="#141E35" rx="4" stroke="#C9A84C" stroke-width="0.7" stroke-opacity="0.5"/>
  <text x="47" y="78" font-family="monospace" font-size="7" fill="#C9A84C" text-anchor="middle">EC8</text>
  <line x1="16" y1="82" x2="78" y2="82" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="47" y="94" font-family="monospace" font-size="6" fill="#8899B4" text-anchor="middle">NF EN 1998</text>
  <text x="20" y="107" font-family="monospace" font-size="6" fill="#3D5068">ags = 1.6</text>
  <text x="20" y="117" font-family="monospace" font-size="6" fill="#3D5068">m/s²</text>
  <text x="20" y="130" font-family="monospace" font-size="6" fill="#DFB95E">q = 1.5</text>
  <text x="20" y="142" font-family="monospace" font-size="6" fill="#DFB95E">γI = 1.0</text>
  <text x="20" y="152" font-family="monospace" font-size="6" fill="#C9A84C">OK ✓</text>

  <!-- Right panel - checklist -->
  <rect x="295" y="60" width="95" height="110" fill="#141E35" rx="4" stroke="#C9A84C" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="342" y="76" font-family="monospace" font-size="7" fill="#C9A84C" text-anchor="middle">VÉRIF.</text>
  <line x1="301" y1="80" x2="384" y2="80" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
  <!-- Checklist items -->
  <circle cx="308" cy="91" r="3" fill="#C9A84C"/>
  <text x="316" y="94" font-family="monospace" font-size="6" fill="#8899B4">Structure OK</text>
  <circle cx="308" cy="104" r="3" fill="#C9A84C"/>
  <text x="316" y="107" font-family="monospace" font-size="6" fill="#8899B4">Fondations OK</text>
  <circle cx="308" cy="117" r="3" fill="#C9A84C"/>
  <text x="316" y="120" font-family="monospace" font-size="6" fill="#8899B4">Contrevent.</text>
  <circle cx="308" cy="130" r="3" fill="#C9A84C"/>
  <text x="316" y="133" font-family="monospace" font-size="6" fill="#8899B4">Ancrage OK</text>
  <line x1="301" y1="138" x2="384" y2="138" stroke="#3D5068" stroke-width="0.5"/>
  <text x="316" y="152" font-family="monospace" font-size="7" fill="#DFB95E">CONFORME</text>

  <!-- Title -->
  <text x="200" y="18" font-family="'Space Grotesk', sans-serif" font-size="10.5" fill="#C9A84C" text-anchor="middle" font-weight="600" letter-spacing="2">ATTESTATION PARASISMIQUE</text>
  <line x1="60" y1="23" x2="340" y2="23" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
</svg>
