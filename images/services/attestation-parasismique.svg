<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1929"/>
      <stop offset="100%" style="stop-color:#182440"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bg4)" rx="8"/>
  <rect width="400" height="240" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.2" rx="8"/>

  <!-- Main document -->
  <rect x="105" y="32" width="180" height="178" fill="#141E35" rx="5" stroke="#3D5068" stroke-width="1.5"/>

  <!-- Document header -->
  <rect x="105" y="32" width="180" height="30" fill="#182440" rx="5"/>
  <rect x="105" y="50" width="180" height="12" fill="#182440"/>
  <text x="195" y="50" font-family="monospace" font-size="7.5" fill="#C9A84C" text-anchor="middle" letter-spacing="1">ATTESTATION</text>
  <text x="195" y="60" font-family="monospace" font-size="6" fill="#8899B4" text-anchor="middle" letter-spacing="1">PARASISMIQUE</text>

  <!-- Gold accent line -->
  <rect x="105" y="70" width="180" height="12" fill="#C9A84C" fill-opacity="0.1" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="195" y="79" font-family="monospace" font-size="6.5" fill="#DFB95E" text-anchor="middle">Réf : AT-PS-2024-0847</text>

  <!-- Document lines -->
  <rect x="120" y="89" width="105" height="3" rx="1" fill="#3D5068"/>
  <rect x="120" y="96" width="140" height="3" rx="1" fill="#3D5068"/>
  <rect x="120" y="103" width="85" height="3" rx="1" fill="#3D5068"/>

  <!-- Info rows -->
  <text x="120" y="118" font-family="monospace" font-size="6" fill="#3D5068">Zone sismique : 3</text>
  <text x="120" y="129" font-family="monospace" font-size="6" fill="#3D5068">Classe importance : II</text>
  <text x="120" y="140" font-family="monospace" font-size="6" fill="#3D5068">Règles : PS-MI / EC8</text>
  <line x1="120" y1="145" x2="270" y2="145" stroke="#3D5068" stroke-width="0.6"/>

  <!-- Official Seal -->
  <g filter="url(#glow4)" transform="translate(195, 178)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="0" cy="0" r="22" fill="#0F1929" stroke="#C9A84C" stroke-width="1"/>
    <!-- Shield -->
    <path d="M0,-13 L10,-5 L10,5 Q10,15 0,18 Q-10,15 -10,5 L-10,-5 Z" fill="#C9A84C" fill-opacity="0.12" stroke="#DFB95E" stroke-width="1.2"/>
    <!-- Checkmark in shield -->
    <polyline points="-4,2 -1,6 6,-4" stroke="#DFB95E" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Label inside -->
    <text x="0" y="28" font-family="monospace" font-size="5" fill="#C9A84C" text-anchor="middle">CONFORME</text>
  </g>

  <!-- Signature line -->
  <line x1="118" y1="198" x2="168" y2="198" stroke="#3D5068" stroke-width="0.8"/>
  <text x="143" y="207" font-family="monospace" font-size="5" fill="#3D5068" text-anchor="middle">Signature</text>

  <!-- Left panel — EC8 data -->
  <rect x="8" y="55" width="80" height="105" fill="#141E35" rx="4" stroke="#C9A84C" stroke-width="0.7" stroke-opacity="0.5"/>
  <text x="48" y="72" font-family="monospace" font-size="7.5" fill="#C9A84C" text-anchor="middle">EC8</text>
  <line x1="14" y1="77" x2="82" y2="77" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="48" y="89" font-family="monospace" font-size="5.5" fill="#8899B4" text-anchor="middle">NF EN 1998</text>
  <text x="18" y="103" font-family="monospace" font-size="6" fill="#3D5068">ags = 1.6</text>
  <text x="18" y="113" font-family="monospace" font-size="6" fill="#3D5068">m/s²</text>
  <text x="18" y="126" font-family="monospace" font-size="6" fill="#DFB95E">q = 1.5</text>
  <text x="18" y="138" font-family="monospace" font-size="6" fill="#DFB95E">γI = 1.0</text>
  <text x="18" y="150" font-family="monospace" font-size="7" fill="#C9A84C">OK ✓</text>

  <!-- Right panel — checklist -->
  <rect x="300" y="55" width="92" height="110" fill="#141E35" rx="4" stroke="#C9A84C" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="346" y="72" font-family="monospace" font-size="7" fill="#C9A84C" text-anchor="middle">VÉRIF.</text>
  <line x1="306" y1="76" x2="386" y2="76" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
  <circle cx="312" cy="88" r="3" fill="#C9A84C"/>
  <text x="320" y="91" font-family="monospace" font-size="6" fill="#8899B4">Structure OK</text>
  <circle cx="312" cy="102" r="3" fill="#C9A84C"/>
  <text x="320" y="105" font-family="monospace" font-size="6" fill="#8899B4">Fondations OK</text>
  <circle cx="312" cy="116" r="3" fill="#C9A84C"/>
  <text x="320" y="119" font-family="monospace" font-size="6" fill="#8899B4">Contrevent.</text>
  <circle cx="312" cy="130" r="3" fill="#C9A84C"/>
  <text x="320" y="133" font-family="monospace" font-size="6" fill="#8899B4">Ancrage OK</text>
  <line x1="306" y1="138" x2="386" y2="138" stroke="#3D5068" stroke-width="0.5"/>
  <text x="320" y="152" font-family="monospace" font-size="7" fill="#DFB95E">CONFORME</text>

  <!-- Title -->
  <text x="200" y="18" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#C9A84C" text-anchor="middle" font-weight="600" letter-spacing="2">ATTESTATION PARASISMIQUE</text>
  <line x1="60" y1="23" x2="340" y2="23" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
</svg>
