  <text x="303" y="109" font-family="monospace" font-size="5.5" fill="#8899B4">Bon fonctionnement</text>
  <text x="303" y="119" font-family="monospace" font-size="5.5" fill="#DFB95E">2 ans</text>
  <line x1="301" y1="124" x2="386" y2="124" stroke="#3D5068" stroke-width="0.5"/>
  <text x="303" y="136" font-family="monospace" font-size="5.5" fill="#8899B4">Décennale</text>
  <text x="303" y="146" font-family="monospace" font-size="6.5" fill="#C9A84C">10 ans</text>
  <text x="303" y="155" font-family="monospace" font-size="5" fill="#3D5068">SMABTP</text>

  <!-- Title -->
  <text x="200" y="18" font-family="'Space Grotesk', sans-serif" font-size="10.5" fill="#C9A84C" text-anchor="middle" font-weight="600" letter-spacing="2">ATTESTATION D'ACHÈVEMENT — AT2</text>
  <line x1="60" y1="23" x2="340" y2="23" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
