  <line x1="301" y1="75" x2="386" y2="75" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="303" y="87" font-family="monospace" font-size="5.5" fill="#8899B4">Parfait achèvement</text>
