  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #0F1929; --surface: #141E35; --gold: #C9A84C; --gold-l: #DFB95E; --text: #EEF2F8; --text2: #8899B4; --text3: #3D5068; --border: rgba(255,255,255,0.07); --border-g: rgba(201,168,76,0.22); }
    [data-theme="light"] { --bg: #EFF3FA; --surface: #FFFFFF; --gold: #7B6010; --gold-l: #886814; --text: #0D1726; --text2: #3A5070; --text3: #7A90AA; --border: rgba(13,23,38,0.09); --border-g: rgba(201,168,76,0.38); }
    html { color-scheme: dark light; }
    body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text2); line-height: 1.75; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: clamp(2rem, 5vw, 3rem); text-align: center; }
    .badge { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--gold); color: var(--gold); margin-bottom: 1.25rem; }

    p { font-size: 0.95rem; margin-bottom: 0.6rem; }
    .delay { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin: 1rem 0 1.5rem; }
    a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 24px; background: var(--gold); color: #06090F; font-weight: 700; font-size: 0.88rem; border-radius: 8px; text-decoration: none; transition: background 0.2s; }
    a.btn:hover { background: var(--gold-l); }
    a.link { display: block; margin-top: 1rem; font-size: 0.85rem; color: var(--gold); text-decoration: none; }
    a.link:hover { color: var(--gold-l); }
