name: check-assets

# Controle obligatoire avant merge (cf. CLAUDE.md) : 404 d'images, vignettes,
# sitemap, compteurs et conventions des photos d'article.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch -q origin master:refs/remotes/origin/master || true
      - run: node tools/check-assets.mjs
